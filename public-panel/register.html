<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - ERAN+</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="ep-header"><div class="ep-logo">ERAN<span>+</span></div></div>
<div class="ep-container" style="padding-top:24px;">
  <div class="ep-card">
    <h1 style="text-align:center;margin-bottom:6px;">Create Account</h1>
    <p style="text-align:center;color:#a6acc2;margin-bottom:20px;">Join ERAN+ today</p>
    <form id="registerForm">
      <label class="ep-label">Full Name</label>
      <input class="ep-input" type="text" id="name" required>
      <label class="ep-label">Username</label>
      <input class="ep-input" type="text" id="username" required>
      <label class="ep-label">Email</label>
      <input class="ep-input" type="email" id="email" required>
      <label class="ep-label">Phone</label>
      <input class="ep-input" type="tel" id="phone" required>
      <label class="ep-label">Password</label>
      <input class="ep-input" type="password" id="password" required minlength="6">
      <button type="submit" class="ep-btn">Register</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:14px;">
      Already have an account? <a href="login.html" style="color:#6c3ce9;">Login</a>
    </p>
  </div>
</div>
<script src="assets/js/app.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const data = await apiRequest('/auth/register', 'POST', {
      name: document.getElementById('name').value,
      username: document.getElementById('username').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      password: document.getElementById('password').value
    });
    Auth.setToken(data.token);
    Auth.setUser(data.user);
    window.location.href = 'dashboard.html';
  } catch (err) { toast(err.message, 'error'); }
});
</script>
</body>
</html>

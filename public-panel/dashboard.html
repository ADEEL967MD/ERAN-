<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - ERAN+</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="ep-header">
  <div class="ep-logo">ERAN<span>+</span></div>
  <div class="ep-header-icons">
    <a href="cart.html">🛒<span class="ep-badge" data-cart-count>0</span></a>
    <a href="profile.html">👤</a>
  </div>
</div>
<div class="ep-container">
  <div class="ep-stats-grid" style="margin-bottom:16px;">
    <div class="ep-stat"><div class="ep-stat-value" id="totalOrders">-</div><div class="ep-stat-label">TOTAL ORDERS</div></div>
    <div class="ep-stat"><div class="ep-stat-value" id="pendingOrders">-</div><div class="ep-stat-label">PENDING</div></div>
    <div class="ep-stat"><div class="ep-stat-value" id="completedOrders">-</div><div class="ep-stat-label">COMPLETED</div></div>
  </div>

  <div class="ep-section-title">Featured Products</div>
  <div class="ep-product-grid" id="featuredProducts"></div>

  <div class="ep-section-title" style="margin-top:20px;">Recent Orders</div>
  <div id="recentOrders"></div>

  <div class="ep-card" style="text-align:center;">
    <a href="support.html" style="color:#6c3ce9;font-weight:700;text-decoration:none;">Need help? Visit Support →</a>
  </div>
</div>

<div class="ep-bottom-nav">
  <a href="dashboard.html" class="active">🏠<br>Home</a>
  <a href="products.html">🛍️<br>Shop</a>
  <a href="orders.html">📦<br>Orders</a>
  <a href="profile.html">👤<br>Profile</a>
</div>

<script src="assets/js/app.js"></script>
<script>
requireAuth();

(async () => {
  try {
    const { orders } = await apiRequest('/user/orders');
    document.getElementById('totalOrders').textContent = orders.length;
    document.getElementById('pendingOrders').textContent = orders.filter(o => o.orderStatus === 'PENDING').length;
    document.getElementById('completedOrders').textContent = orders.filter(o => o.orderStatus === 'DELIVERED').length;

    const recentEl = document.getElementById('recentOrders');
    recentEl.innerHTML = orders.slice(0, 3).map(o => `
      <div class="ep-card">
        <div style="display:flex;justify-content:space-between;">
          <strong>#${o._id.slice(-6)}</strong>
          <span class="ep-badge-status status-${o.orderStatus}">${o.orderStatus}</span>
        </div>
        <div style="color:#a6acc2;font-size:13px;margin-top:4px;">${money(o.total)}</div>
      </div>
    `).join('') || '<p style="color:#a6acc2;">No orders yet</p>';
  } catch (err) { console.error(err); }

  try {
    const { products } = await apiRequest('/products?limit=4');
    document.getElementById('featuredProducts').innerHTML = products.map(p => `
      <a href="product-details.html?id=${p._id}" class="ep-product-card">
        <img src="${p.image || 'assets/images/placeholder.png'}" alt="${p.name}">
        <div class="ep-product-body">
          <div class="ep-product-name">${p.name}</div>
          <div class="ep-product-price">${money(p.price)}</div>
        </div>
      </a>
    `).join('');
  } catch (err) { console.error(err); }
})();
</script>
</body>
</html>

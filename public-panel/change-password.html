<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password - ERAN+</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="ep-header"><div class="ep-logo">ERAN<span>+</span></div></div>
<div class="ep-container">
  <div class="ep-card">
    <form id="pwForm">
      <label class="ep-label">Current Password</label>
      <input class="ep-input" type="password" id="currentPassword" required>
      <label class="ep-label">New Password</label>
      <input class="ep-input" type="password" id="newPassword" required minlength="6">
      <button type="submit" class="ep-btn">Update Password</button>
    </form>
  </div>
</div>
<script src="assets/js/app.js"></script>
<script>
requireAuth();
document.getElementById('pwForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await apiRequest('/auth/change-password', 'POST', {
      currentPassword: document.getElementById('currentPassword').value,
      newPassword: document.getElementById('newPassword').value
    });
    toast('Password changed!');
    document.getElementById('pwForm').reset();
  } catch (err) { toast(err.message, 'error'); }
});
</script>
</body>
</html>
